### Model Configuration (`models.yaml`)

The models used in this study were specified in a YAML configuration file (`models.yaml`). The configuration defined the provider, model identifier, and inference temperature for each large language model included in the experiment. Using a central configuration file ensured that the same experimental matrix was submitted consistently to every model and supported the reproducibility of the data collection process.

```yaml
models:

  - provider: groq
    model_name: openai/gpt-oss-120b
    temperature: 0.0

  - provider: groq
    model_name: llama-3.3-70b-versatile
    temperature: 0.0

  - provider: groq
    model_name: qwen/qwen3-32b
    temperature: 0.0

  - provider: groq
    model_name: meta-llama/llama-4-scout-17b-16e-instruct
    temperature: 0.0

  - provider: google
    model_name: gemma-4-26b-a4b-it
    temperature: 0.0

  - provider: mistral
    model_name: mistral-small-2506
    temperature: 0.0

  - provider: openrouter
    model_name: nvidia/nemotron-3-super-120b-a12b
    temperature: 0.0
```

All models were evaluated using the same prompt set and a fixed **temperature of 0.0** to minimise stochastic variation and maximise reproducibility. The configuration file was read programmatically by the Python data collection pipeline, ensuring that each model received the identical set of 160 city–scenario prompts and that model-specific metadata were recorded automatically during data collection.

